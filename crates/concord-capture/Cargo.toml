[package]
name = "concord-capture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
png = "=0.18.1"
log = "=0.4.35"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
livekit = "=0.12.0"
parking_lot = "=0.12.5"
wasapi = "=0.27.0"
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "System",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "=0.3.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "test-util"] }

[lints]
workspace = true
