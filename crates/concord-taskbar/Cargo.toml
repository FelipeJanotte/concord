[package]
name = "concord-taskbar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
png = { version = "=0.18.1", default-features = false }
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
