[package]
name = "concord"
version = "0.1.26"
edition = "2021"
publish = false

[lib]
name = "concord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.7", features = ["image-png"] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
url = "=2.5.8"
log = "=0.4.35"
tauri-plugin-log = "=2.10.2"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
sha2 = "=0.11.1"
base64 = "=0.23.1"
rand = "=0.10.4"
tokio = { version = "=1.54.1", features = ["net", "io-util", "time", "rt", "sync"] }
concord-ptt = { path = "../crates/concord-ptt" }
concord-capture = { path = "../crates/concord-capture" }
concord-taskbar = { path = "../crates/concord-taskbar" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
