[package]
name = "concord"
version = "0.1.26"
edition = "2021"
publish = false

[lib]
name = "concord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = "=2.7.6"
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
url = "=2.5.8"
log = "=0.4.35"
tauri-plugin-global-shortcut = "=2.4.1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]
