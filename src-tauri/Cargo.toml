[package]
name = "concord"
version = "0.1.26"
edition = "2021"
publish = false

[lib]
name = "concord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
url = "=2.5.8"
