# LiveKit de PRODUÇÃO (A14). A chave e o segredo vêm da variável LIVEKIT_KEYS (docker-compose.prod.yml).
port: 7880
bind_addresses:
  - ''

rtc:
  # WebRTC por TCP (para redes que bloqueiam UDP) e uma porta UDP única
  tcp_port: 7881
  udp_port: 7882
  # descobre o IP público da máquina (atrás de NAT/VPS)
  use_external_ip: true

# TURN embutido: quem está atrás de firewall/NAT restritivo passa a mídia por aqui (UDP 3478).
turn:
  enabled: true
  udp_port: 3478

room:
  empty_timeout: 300

logging:
  level: info
