# Release (A13): gera o instalador do Windows e publica no GitHub Releases com o latest.yml. Os apps
# instalados acham a versão nova sozinhos. Roda de dois jeitos:
# - chamado pelo auto-release.yml a cada PR que entra na main (o normal);
# - ao criar uma tag vX.Y.Z à mão (git tag v1.2.3 && git push origin v1.2.3).
# A versão do app vem da TAG (aplicada no package.json só durante o build; nada é commitado).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: tag a publicar (vX.Y.Z)
        required: true
        type: string
      notes:
        description: notas da versão (título do PR)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: instalador do Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Usar a versão da tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $TAG (esperado vX.Y.Z)"
            exit 1
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          echo "Gerando a versão $(node -p "require('./package.json').version")"

      - name: Typecheck
        run: npm run typecheck

      - name: Gerar e publicar
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Servidor padrão da tela de login no instalador (variável do repositório em Settings → Secrets and
          # variables → Actions → Variables). Vazia: localhost:3001. Quem já entrou guarda o servidor no login.
          VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER }}

      - name: Notas da versão
        if: inputs.notes != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: gh release edit "$TAG" --notes "$NOTES"
