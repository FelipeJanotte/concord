name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: tag a publicar (vX.Y.Z)
        required: true
        type: string
      notes:
        description: notas da versão (título do PR)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: instalador do Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Usar a versão da tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $TAG (esperado vX.Y.Z)"
            exit 1
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          echo "Gerando a versão $(node -p "require('./package.json').version")"

      - name: Typecheck
        run: npm run typecheck

      - name: Gerar e publicar
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER }}

      - name: Notas da versão
        if: inputs.notes != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: gh release edit "$TAG" --notes "$NOTES"
