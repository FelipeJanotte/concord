# CI (A12): em todo PR e push na main, confere tipos e roda a suíte inteira.
# Sem Docker: sem DATABASE_URL/DATABASE_URL_TEST os testes usam PGlite, e a voz usa o LiveKit falso dos testes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# um PR novo cancela a execução anterior do mesmo PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # o binário do Electron não é usado nos testes (o processo principal é testado com Electron falso)
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  desktop-linux:
    name: desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Dependências do WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

  desktop-windows:
    name: desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: instalador-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  desktop-cutover:
    name: troca do Electron pelo Tauri (autostart ${{ matrix.autostart }})
    needs: desktop-windows
    strategy:
      fail-fast: false
      matrix:
        autostart: [true, false]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: instalador-nsis
          path: instalador

      - name: Trocar o Electron instalado pelo instalador novo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = (Get-ChildItem instalador -Filter '*-setup.exe' | Select-Object -First 1).FullName
          ./.github/scripts/cutover-test.ps1 -NewInstaller $installer -AppId com.concord.app -AutostartWasOn:$${{ matrix.autostart }}
