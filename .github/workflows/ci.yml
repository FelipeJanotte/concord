# CI (A12): em todo PR e push na main, confere tipos e roda a suíte inteira.
# Sem Docker: sem DATABASE_URL/DATABASE_URL_TEST os testes usam PGlite, e a voz usa o LiveKit falso dos testes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# um PR novo cancela a execução anterior do mesmo PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # o binário do Electron não é usado nos testes (o processo principal é testado com Electron falso)
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test
