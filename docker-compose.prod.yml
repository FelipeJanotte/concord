# Concord em PRODUÇÃO (A14): servidor + PostgreSQL + LiveKit (voz/tela com TURN) + Caddy (HTTPS).
# Passo a passo em deploy/README.md. Resumo:
#   cp deploy/.env.example .env   # e preencha domínios e segredos
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Portas que precisam estar abertas no firewall da máquina: 80/tcp e 443/tcp (Caddy),
# 7881/tcp, 7882/udp e 3478/udp (mídia do LiveKit). O Postgres não fica exposto.

name: concord-prod

services:
  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATA_DIR: /data
      PORT: '3001'
      # atrás do Caddy: o limite de requisições usa o IP verdadeiro (X-Forwarded-For)
      TRUST_PROXY: '1'
      # o app conecta como concord_app (privilégio mínimo); as migrations rodam como o dono
      DATABASE_URL: postgres://concord_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@postgres:5432/concord
      DATABASE_MIGRATE_URL: postgres://concord:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/concord
      FILES_SIGNING_SECRET: ${FILES_SIGNING_SECRET:?defina FILES_SIGNING_SECRET no .env}
      # o app fala com o LiveKit pelo domínio (wss); o servidor fala com ele por dentro
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN:?defina LIVEKIT_DOMAIN no .env}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - concord-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: concord
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria o usuário concord_app na primeira inicialização do volume
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concord -d concord']
      interval: 5s
      timeout: 3s
      retries: 20

  # backup diário (pg_dump compactado) no volume pg-backups; mantém os 7 mais novos
  pg-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: concord
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: concord
    volumes:
      - pg-backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          f="/backups/concord-$$(date -u +%Y-%m-%dT%H-%M-%SZ).sql.gz"
          if pg_dump --no-owner | gzip > "$$f.part"; then mv "$$f.part" "$$f"; echo "backup: $$f"; else rm -f "$$f.part"; echo "backup falhou"; fi
          ls -1t /backups/concord-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # "chave: segredo" (os mesmos LIVEKIT_API_KEY/SECRET do servidor)
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}'
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881' # WebRTC por TCP
      - '7882:7882/udp' # WebRTC por UDP
      - '3478:3478/udp' # TURN

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
      - livekit
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN:?defina CONCORD_DOMAIN no .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?defina LIVEKIT_DOMAIN no .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  concord-data:
  pgdata:
  pg-backups:
  caddy-data:
  caddy-config:
