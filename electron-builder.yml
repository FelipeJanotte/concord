appId: com.concord.app
productName: Concord
# Não recompila dependências nativas: a única é o uiohook-napi (B20), que usa N-API e já traz o binário pronto
# para cada sistema (prebuilds/). Recompilar exigiria Python + Visual Studio na máquina que gera o instalador.
npmRebuild: false
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!server/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}'
  - '!README.md'
win:
  executableName: concord
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
# Atualização automática (A13): o instalador e o latest.yml vão para os GitHub Releases, e o
# electron-updater do app instalado procura a versão nova lá. Publicar: tag vX.Y.Z (workflow release.yml).
publish:
  provider: github
  owner: FelipeJanotte
  repo: concord
  releaseType: release
